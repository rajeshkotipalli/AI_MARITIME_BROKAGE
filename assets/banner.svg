<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0c1e4a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1200" height="420" fill="url(#sky)"/>
  <g fill="#fff" opacity="0.7">
    <circle cx="90" cy="60" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="110" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="40" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="85" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="50" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
  <!-- compass rings -->
  <g fill="none" stroke="#67e8f9" stroke-opacity="0.25" transform="translate(960 190)">
    <circle r="150" stroke-dasharray="4 10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="60s" repeatCount="indefinite"/></circle>
    <circle r="105"/>
    <path d="M0 -165 L0 165 M-165 0 L165 0" stroke-opacity="0.15"/>
  </g>
  <!-- isometric container stack (3D) -->
  <g transform="translate(960 190)" filter="url(#shadow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="5s" repeatCount="indefinite"/>
      <g filter="url(#glow)">
        <polygon points="0,-90 78,-45 0,0 -78,-45" fill="url(#top)"/>
        <polygon points="-78,-45 0,0 0,90 -78,45" fill="url(#left)"/>
        <polygon points="78,-45 0,0 0,90 78,45" fill="url(#right)"/>
      </g>
      <g stroke="#e0f2fe" stroke-opacity="0.35" fill="none">
        <path d="M-52 -30 L-52 62 M-26 -15 L-26 77 M26 -15 L26 77 M52 -30 L52 62"/>
      </g>
      <g transform="translate(0 -110) scale(0.62)" opacity="0.95">
        <polygon points="0,-90 78,-45 0,0 -78,-45" fill="url(#top)"/>
        <polygon points="-78,-45 0,0 0,90 -78,45" fill="#0284c7"/>
        <polygon points="78,-45 0,0 0,90 78,45" fill="#4f46e5"/>
      </g>
    </g>
  </g>
  <!-- title -->
  <text x="70" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#67e8f9" letter-spacing="8" opacity="0.9">AI-POWERED MARITIME BROKERAGE</text>
  <text x="66" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="url(#title)" filter="url(#glow)">WAYPOINT AI</text>
  <text x="70" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">Navigate Smarter. Decide Faster. Operate Better.</text>
  <!-- waves -->
  <path fill="#0891b2" fill-opacity="0.45" d="M0 350 Q150 320 300 350 T600 350 T900 350 T1200 350 V420 H0Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0 350 Q150 320 300 350 T600 350 T900 350 T1200 350 V420 H0Z;M0 350 Q150 380 300 350 T600 350 T900 350 T1200 350 V420 H0Z;M0 350 Q150 320 300 350 T600 350 T900 350 T1200 350 V420 H0Z"/>
  </path>
  <path fill="#0e7490" fill-opacity="0.6" d="M0 375 Q200 345 400 375 T800 375 T1200 375 V420 H0Z">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="M0 375 Q200 345 400 375 T800 375 T1200 375 V420 H0Z;M0 375 Q200 405 400 375 T800 375 T1200 375 V420 H0Z;M0 375 Q200 345 400 375 T800 375 T1200 375 V420 H0Z"/>
  </path>
  <path fill="#082f49" d="M0 398 Q300 378 600 398 T1200 398 V420 H0Z"/>
</svg>
